[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-agent-synthetic-trajectory-evaluator-skill"
version = "1.0.0"
description = "Execution trajectory evaluator computing action-level precision, recall, and Levenshtein sequence edit distance against gold benchmarks."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GenPark AI", email = "engineering@genpark.ai"}]
keywords = ["ai-agent", "mcp", "web-browsing", "dom-pruning", "zero-dependency"]
dependencies = []

[project.urls]
Homepage = "https://genpark.ai/mcp"
Repository = "https://github.com/alphaparkinc/genpark-agent-synthetic-trajectory-evaluator-skill"
